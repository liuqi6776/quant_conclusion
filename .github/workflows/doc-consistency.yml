name: doc-consistency

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-docs:
    name: 文档一致性 check_docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 运行文档一致性检查
        run: |
          python tools/check_docs.py --verbose
